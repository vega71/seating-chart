<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 자리배치 시스템</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="app-header">
            <div class="header-logo">
                <i data-lucide="layout-grid" class="logo-icon"></i>
                <h1>스마트 자리배치 시스템</h1>
            </div>
            <p class="header-subtitle">학생들의 자리를 효율적으로 배치하고 관리하세요.</p>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="app-main">
            <!-- 왼쪽: 컨트롤 패널 -->
            <section class="control-panel glass">
                <div class="panel-section">
                    <h2><i data-lucide="users"></i> 학생 명단 입력</h2>
                    <p class="section-desc">학생 이름을 한 줄에 한 명씩 입력해 주세요. (최대 20명)</p>
                    <textarea id="student-input" placeholder="김철수&#10;이영희&#10;박민수&#10;..."></textarea>
                    
                    <div class="button-group-row">
                        <button id="btn-load-dummy" class="btn btn-secondary">
                            <i data-lucide="sparkles"></i> 예시 명단 채우기
                        </button>
                        <button id="btn-register" class="btn btn-primary">
                            <i data-lucide="user-check"></i> 명단 등록
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h2><i data-lucide="sliders"></i> 배치 설정</h2>
                    <div class="stats-container">
                        <div class="stat-card">
                            <span class="stat-label">총 학생 수</span>
                            <span id="stat-total" class="stat-value">0 / 20</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">배치 완료</span>
                            <span id="stat-placed" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="button-group-column">
                        <button id="btn-shuffle" class="btn btn-accent btn-large" disabled>
                            <i data-lucide="shuffle"></i> 랜덤 배치 시작
                        </button>
                        <div class="button-group-row">
                            <button id="btn-reset" class="btn btn-outline" disabled>
                                <i data-lucide="refresh-cw"></i> 자리 비우기
                            </button>
                            <button id="btn-presentation" class="btn btn-secondary" disabled>
                                <i data-lucide="maximize-2"></i> 크게 보기
                            </button>
                        </div>
                    </div>
                </div>

                <div class="panel-section print-hide">
                    <h2><i data-lucide="save"></i> 자리배치 저장 및 관리</h2>
                    <p class="section-desc">현재 자리배치를 브라우저 또는 파일로 저장하고 불러옵니다.</p>
                    <div class="button-group-column">
                        <div class="button-group-row">
                            <button id="btn-save" class="btn btn-primary" disabled title="현재 상태를 브라우저에 저장">
                                <i data-lucide="save"></i> 저장하기
                            </button>
                            <button id="btn-load" class="btn btn-secondary" disabled title="저장된 상태 불러오기">
                                <i data-lucide="folder-open"></i> 불러오기
                            </button>
                        </div>
                        <div class="button-group-row">
                            <button id="btn-export-file" class="btn btn-secondary" disabled title="파일(.json)로 내보내기">
                                <i data-lucide="download"></i> 파일 저장
                            </button>
                            <button id="btn-import-file" class="btn btn-secondary" title="파일(.json) 불러오기">
                                <i data-lucide="upload"></i> 파일 불러오기
                            </button>
                            <input type="file" id="file-input" accept=".json" style="display: none;">
                        </div>
                    </div>
                    <div id="save-status-info" class="save-status-info">
                        <i data-lucide="clock"></i> <span id="save-time-text">저장 기록 없음</span>
                    </div>
                </div>

                <div class="panel-section print-hide">
                    <h2><i data-lucide="printer"></i> 내보내기 및 출력</h2>
                    <div class="button-group-row">
                        <button id="btn-print" class="btn btn-secondary full-width">
                            <i data-lucide="printer"></i> 인쇄 / PDF 저장
                        </button>
                    </div>
                </div>
            </section>

            <!-- 오른쪽: 배치판 영역 -->
            <section class="board-container glass">
                <!-- 칠판/교탁 표시 -->
                <div class="classroom-front">
                    <div class="blackboard">
                        <span class="board-text">칠판 / 교탁 (앞쪽)</span>
                    </div>
                </div>

                <!-- 자리배치 그리드 -->
                <div class="seating-grid-wrapper">
                    <div id="seating-grid" class="seating-grid">
                        <!-- JS에서 20개의 자리가 동적으로 생성됩니다. -->
                    </div>
                </div>

                <!-- 대기실 (아직 배치되지 않은 학생) -->
                <div class="waiting-area-section">
                    <h3><i data-lucide="log-in"></i> 대기 학생 목록</h3>
                    <div id="waiting-list" class="waiting-list">
                        <p class="empty-waiting-msg">학생 명단을 등록하면 여기에 표시됩니다.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 프리젠테이션 모드 복귀 버튼 (기본 숨김) -->
    <button id="btn-exit-presentation" class="btn-exit-presentation print-hide" title="편집 모드로 복귀">
        <i data-lucide="minimize-2"></i> <span>편집 모드로 복귀 (ESC)</span>
    </button>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="toast-container print-hide"></div>

    <!-- 스크립트 등록 -->
    <script src="app.js"></script>
    <script>
        // Lucide Icons 초기화
        lucide.createIcons();
    </script>
</body>
</html>
