<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 교실 자리배치 시스템 (독립형)</title>
  <!-- Google Fonts 적용 (Outfit & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 외부 라이브러리 CDN (SheetJS, html2pdf.js, Lucide Icons) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ----------------------------------------------------
       디자인 시스템 및 CSS 변수
    ---------------------------------------------------- */
    :root {
      /* 라이트 모드 (기본값) */
      --bg-app: #f1f5f9;
      --bg-sidebar: rgba(255, 255, 255, 0.7);
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-seat-empty: rgba(255, 255, 255, 0.4);
      --bg-seat-occupied: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --bg-seat-hover: rgba(59, 130, 246, 0.1);
      --border-color: rgba(226, 232, 240, 0.8);
      --border-seat-empty: 2px dashed #cbd5e1;
      --border-seat-hover: 2px dashed #3b82f6;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #ffffff;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      
      --glass-border: rgba(255, 255, 255, 0.18);
      
      --accent-color: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      --success-color: #10b981;
      --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger-color: #ef4444;
      --info-color: #06b6d4;
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* 다크 모드 */
      --bg-app: #0b0f19;
      --bg-sidebar: rgba(17, 24, 39, 0.7);
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-seat-empty: rgba(31, 41, 55, 0.4);
      --bg-seat-occupied: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      --bg-seat-hover: rgba(37, 99, 235, 0.2);
      --border-color: rgba(75, 85, 99, 0.4);
      --border-seat-empty: 2px dashed #4b5563;
      --border-seat-hover: 2px dashed #3b82f6;
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-light: #ffffff;
      
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    /* ----------------------------------------------------
       글로벌 초기화 및 기본 스타일
    ---------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      transition: background-color var(--transition-normal), color var(--transition-normal);
      overflow-x: hidden;
    }

    /* ----------------------------------------------------
       앱 레이아웃 & 컨테이너
    ---------------------------------------------------- */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px;
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
    }

    /* 헤더 */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-radius: 16px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: var(--accent-gradient);
      color: var(--text-light);
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .icon-btn:hover {
      background-color: var(--border-color);
      transform: translateY(-2px);
    }

    /* 테마 스위처 아이콘 제어 */
    .theme-icon {
      width: 20px;
      height: 20px;
    }
    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }
    body:not([data-theme="dark"]) .sun-icon { display: none; }
    body:not([data-theme="dark"]) .moon-icon { display: block; }

    /* 메인 그리드 분할 */
    .app-main {
      display: flex;
      gap: 24px;
      flex: 1;
      align-items: stretch;
    }

    /* ----------------------------------------------------
       공통 글래스 카드 (UI 컴포넌트)
    ---------------------------------------------------- */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: background-color var(--transition-normal), border-color var(--transition-normal);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      color: var(--accent-color);
      width: 22px;
      height: 22px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: -8px;
    }

    /* ----------------------------------------------------
       사이드바 (컨트롤 패널)
    ---------------------------------------------------- */
    .control-sidebar {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    /* 드롭존 */
    .dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-normal);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent-color);
      background-color: rgba(59, 130, 246, 0.05);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      margin-bottom: 12px;
      transition: color var(--transition-fast), transform var(--transition-normal);
    }

    .dropzone:hover .upload-icon {
      color: var(--accent-color);
      transform: translateY(-4px);
    }

    .dropzone-text {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .file-spec {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 로드된 파일 정보 */
    .loaded-file-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 12px 16px;
      border-radius: 10px;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 80%;
    }

    .success-icon {
      color: var(--success-color);
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-danger-btn {
      background: transparent;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .text-danger-btn:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* 버튼 스타일 */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
      color: var(--text-light);
      box-shadow: var(--shadow-sm);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-primary {
      background: var(--accent-gradient);
      grid-column: span 2;
      padding: 14px;
      font-size: 1.05rem;
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #64748b;
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: #475569;
    }

    .btn-success {
      background: var(--success-gradient);
    }
    .btn-success:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }

    .btn-info {
      background-color: var(--info-color);
      grid-column: span 2;
    }
    .btn-info:hover:not(:disabled) {
      background-color: #0891b2;
    }

    /* 대기 학생 목록 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background-color: var(--border-color);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .waiting-students-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px;
      border-radius: 8px;
    }

    .empty-list-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      width: 100%;
      padding: 32px 0;
    }

    /* 대기 학생 카드 */
    .student-badge-item {
      background-color: var(--border-color);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: grab;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
    }

    .student-badge-item:hover {
      background-color: var(--accent-color);
      color: var(--text-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .student-badge-item:active {
      cursor: grabbing;
    }

    .student-badge-item.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    .student-badge-item .num-tag {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* ----------------------------------------------------
       우측 자리배치도 레이아웃 영역
    ---------------------------------------------------- */
    .seating-layout-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-sidebar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 16px 24px 20px 24px;
      box-shadow: var(--shadow-glass);
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 600px;
    }

    /* 교탁 / 칠판 */
    .classroom-front {
      width: 60%;
      max-width: 400px;
      margin-bottom: 8px;
    }

    .chalkboard {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-light);
      border: 3px solid #64748b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 4px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .chalkboard::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 20%;
      width: 60%;
      height: 3px;
      background-color: #cbd5e1;
      border-radius: 2px;
    }

    /* 자리배치 그리드 컨테이너 */
    .seating-grid-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }

    /* 복도 4열 5행 구조 그리드 */
    .seating-grid {
      display: grid;
      /* 1열, 2열, 통로(50px), 3열, 4열 */
      grid-template-columns: repeat(2, 1fr) 50px repeat(2, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 10px 16px;
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 420px;
    }

    /* 복도(통로) 셀 설정 */
    .seating-aisle {
      grid-column: 3;
      grid-row: span 5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .aisle-line {
      width: 2px;
      height: 90%;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 8px,
        var(--border-color) 8px,
        var(--border-color) 16px
      );
      opacity: 0.8;
    }

    /* 개별 좌석 카드 (빈자리) */
    .seat-card {
      border: var(--border-seat-empty);
      background-color: var(--bg-seat-empty);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: all var(--transition-normal);
      padding: 6px;
    }

    .seat-card:hover {
      border-color: var(--accent-color);
      background-color: var(--bg-seat-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .seat-card.dragover {
      border-color: var(--success-color);
      background-color: rgba(16, 185, 129, 0.1);
      transform: scale(1.02);
    }

    /* 빈 좌석 내부 요소 */
    .seat-empty-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .seat-empty-inner svg {
      width: 24px;
      height: 24px;
      opacity: 0.6;
    }

    .seat-empty-text {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* ----------------------------------------------------
       배치 완료된 학생 좌석 카드
    ---------------------------------------------------- */
    .seat-card.occupied {
      border: 1px solid var(--glass-border);
      background: var(--bg-seat-occupied);
      color: var(--text-light);
      cursor: grab;
      box-shadow: var(--shadow-md);
    }

    .seat-card.occupied:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), 0 0 16px rgba(59, 130, 246, 0.3);
    }

    .seat-card.occupied:active {
      cursor: grabbing;
    }

    .seat-card.occupied.dragging {
      opacity: 0.3;
    }

    .seat-student-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .seat-student-num {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: rgba(255, 255, 255, 0.22);
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .seat-student-name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    /* 셔플 애니메이션 */
    @keyframes seatPopIn {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .seat-card.animate-pop {
      animation: seatPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 하단 상태 바 */
    .seating-status-bar {
      display: flex;
      gap: 24px;
      padding: 4px 16px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-item strong {
      color: var(--text-main);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.total { background-color: var(--text-muted); }
    .status-dot.occupied { background-color: var(--accent-color); }
    .status-dot.empty { background-color: #cbd5e1; }
    [data-theme="dark"] .status-dot.empty { background-color: #4b5563; }

    /* ----------------------------------------------------
       크게 보기 (Fullscreen) 스타일
    ---------------------------------------------------- */
    .app-container.fullscreen-mode {
      padding: 0;
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-app);
    }

    .app-container.fullscreen-mode .app-header,
    .app-container.fullscreen-mode .control-sidebar,
    .app-container.fullscreen-mode .seating-status-bar {
      display: none !important;
    }

    .app-container.fullscreen-mode .app-main {
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .app-container.fullscreen-mode .seating-layout-area {
      border-radius: 0;
      border: none;
      background: transparent;
      box-shadow: none;
      padding: 0 0 60px 0;
      width: 100%;
      height: 100%;
      justify-content: space-between;
    }

    .app-container.fullscreen-mode .classroom-front {
      max-width: 600px;
      width: 70%;
      margin-bottom: 0px;
    }

    .app-container.fullscreen-mode .chalkboard {
      font-size: 1.4rem;
      padding: 12px;
    }

    .app-container.fullscreen-mode .seating-grid {
      max-width: 1200px;
      max-height: 78vh;
      gap: 12px 24px;
      height: 100%;
    }

    .app-container.fullscreen-mode .seating-aisle {
      grid-template-columns: repeat(2, 1fr) 80px repeat(2, 1fr);
    }

    .app-container.fullscreen-mode .seat-card {
      padding: 8px 12px;
      border-radius: 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .app-container.fullscreen-mode .seat-card .seat-index {
      font-size: 1rem;
      top: 12px;
      left: 16px;
    }

    .app-container.fullscreen-mode .seat-student-num {
      font-size: 1.2rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    .app-container.fullscreen-mode .seat-student-name {
      font-size: 2.2rem;
    }

    .app-container.fullscreen-mode .seat-empty-text {
      font-size: 1.4rem;
    }

    .app-container.fullscreen-mode .seat-empty-inner svg {
      width: 32px;
      height: 32px;
    }

    /* 크게 보기 닫기 힌트 */
    .fullscreen-close-hint {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 9999;
    }

    .app-container.fullscreen-mode .fullscreen-close-hint {
      display: flex;
    }

    /* ----------------------------------------------------
       PDF 출력 및 인쇄 최적화 스타일 (@media print)
    ---------------------------------------------------- */
    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm;
      }

  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-badge">SYSTEM</span>
        <h1>스마트 자리배치</h1>
      </div>
      <div class="theme-toggle-area">
        <button id="themeToggleBtn" class="icon-btn" title="화면 테마 변경">
          <i data-lucide="sun" class="theme-icon sun-icon"></i>
          <i data-lucide="moon" class="theme-icon moon-icon"></i>
        </button>
      </div>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="app-main">
      <!-- 좌측: 설정 및 학생 명단 제어 영역 -->
      <section class="control-sidebar">
        <!-- 엑셀 업로드 카드 -->
        <div class="card glass-card upload-card">
          <h2 class="card-title">
            <i data-lucide="file-spreadsheet"></i> 명단 불러오기
          </h2>
          <p class="card-subtitle">'공동실습소 출석부' 엑셀 파일을 업로드하세요.</p>
          
          <div class="dropzone" id="excelDropzone">
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;">
            <div class="dropzone-content">
              <i data-lucide="upload-cloud" class="upload-icon"></i>
              <p class="dropzone-text">파일을 여기로 드래그하거나 클릭하세요</p>
              <span class="file-spec">xlsx, xls 파일만 지원</span>
            </div>
          </div>
          
          <div class="loaded-file-info" id="fileInfoArea" style="display: none;">
            <div class="file-meta">
              <i data-lucide="check-circle" class="success-icon"></i>
              <span class="file-name" id="loadedFileName">파일명.xlsx</span>
            </div>
            <button id="removeFileBtn" class="text-danger-btn" title="파일 제거">
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>

        <!-- 액션 제어 패널 -->
        <div class="card glass-card actions-card">
          <h2 class="card-title">
            <i data-lucide="sliders"></i> 배정 컨트롤
          </h2>
          <div class="action-buttons">
            <button id="randomShuffleBtn" class="btn btn-primary" disabled>
              <i data-lucide="shuffle"></i> 랜덤 배정
            </button>
            <button id="clearSeatingBtn" class="btn btn-secondary" disabled>
              <i data-lucide="trash-2"></i> 배치 지우기
            </button>
            <button id="exportPdfBtn" class="btn btn-success" disabled>
              <i data-lucide="download"></i> PDF 다운로드
            </button>
            <button id="fullscreenBtn" class="btn btn-info">
              <i data-lucide="expand"></i> 크게 보기
            </button>
          </div>
        </div>

        <!-- 대기/미배정 학생 목록 -->
        <div class="card glass-card list-card">
          <div class="list-header">
            <h2 class="card-title">
              <i data-lucide="users"></i> 대기 학생 명단
            </h2>
            <span class="badge" id="waitingCountBadge">0명</span>
          </div>
          <div class="waiting-students-list" id="waitingList" dropzone="copy">
            <div class="empty-list-msg">
              엑셀 파일을 업로드하면 명단이 표시됩니다.
            </div>
          </div>
        </div>
      </section>

      <!-- 우측: 자리배치도 판 -->
      <section class="seating-layout-area">
        <!-- 교실 앞쪽 (교탁/칠판 표시) -->
        <div class="classroom-front">
          <div class="chalkboard">
            <span>교 탁 (칠 판)</span>
          </div>
        </div>

        <!-- 자리 그리드 (4열 5행 + 중앙 통로) -->
        <div class="seating-grid-container" id="seatingGridContainer">
          <div class="seating-grid" id="seatingGrid">
            <!-- JS에서 동적으로 좌석 카드를 생성합니다 -->
          </div>
        </div>

        <!-- 하단 상태 요약 -->
        <div class="seating-status-bar">
          <div class="status-item">
            <span class="status-dot total"></span>
            <span>총 좌석: <strong id="totalSeatsCount">20</strong>석</span>
          </div>
          <div class="status-item">
            <span class="status-dot occupied"></span>
            <span>배정됨: <strong id="occupiedSeatsCount">0</strong>명</span>
          </div>
          <div class="status-item">
            <span class="status-dot empty"></span>
            <span>빈자리: <strong id="emptySeatsCount">20</strong>석</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 크게 보기(전체화면) 전용 오버레이 종료 안내 -->
    <div class="fullscreen-close-hint" id="fullscreenCloseHint">
      <span>화면을 더블클릭하거나 ESC 키를 누르면 원래 화면으로 돌아갑니다.</span>
      <button id="exitFullscreenBtn" class="btn btn-secondary btn-sm">크게 보기 종료</button>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 상태 관리 변수
    // ----------------------------------------------------
    let allStudents = [];      
    let seatAssignments = Array(20).fill(null); 
    let dragSource = null;     

    // ----------------------------------------------------
    // DOM 엘리먼트 참조
    // ----------------------------------------------------
    const appContainer = document.getElementById('appContainer');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const excelDropzone = document.getElementById('excelDropzone');
    const excelFileInput = document.getElementById('excelFileInput');
    const fileInfoArea = document.getElementById('fileInfoArea');
    const loadedFileName = document.getElementById('loadedFileName');
    const removeFileBtn = document.getElementById('removeFileBtn');

    const randomShuffleBtn = document.getElementById('randomShuffleBtn');
    const clearSeatingBtn = document.getElementById('clearSeatingBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');

    const waitingList = document.getElementById('waitingList');
    const waitingCountBadge = document.getElementById('waitingCountBadge');
    const seatingGrid = document.getElementById('seatingGrid');

    const occupiedSeatsCount = document.getElementById('occupiedSeatsCount');
    const emptySeatsCount = document.getElementById('emptySeatsCount');

    // ----------------------------------------------------
    // 초기화 및 이벤트 리스너 등록
    // ----------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      initLucide();
      initTheme();
      renderGrid();
      setupEventListeners();
      loadDefaultExcelFile(); // 처음에 디폴트 엑셀 자동 로드 시도
    });

    // Lucide 아이콘 렌더링
    function initLucide() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    // 테마 초기화 및 변경
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });
    }

    // 이벤트 리스너 등록
    function setupEventListeners() {
      excelDropzone.addEventListener('click', () => excelFileInput.click());
      excelFileInput.addEventListener('change', handleFileSelect);
      
      excelDropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        excelDropzone.classList.add('dragover');
      });
      
      excelDropzone.addEventListener('dragleave', () => {
        excelDropzone.classList.remove('dragover');
      });
      
      excelDropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        excelDropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
          processExcelFile(e.dataTransfer.files[0]);
        }
      });
      
      removeFileBtn.addEventListener('click', clearLoadedFile);
      randomShuffleBtn.addEventListener('click', assignSeatsRandomly);
      clearSeatingBtn.addEventListener('click', resetSeating);
      exportPdfBtn.addEventListener('click', exportToPdf);
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      exitFullscreenBtn.addEventListener('click', exitFullscreen);
      
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          appContainer.classList.remove('fullscreen-mode');
        }
      });
      
      appContainer.addEventListener('dblclick', (e) => {
        if (appContainer.classList.contains('fullscreen-mode')) {
          if (e.target.closest('.seat-card') || e.target.closest('.student-badge-item')) return;
          exitFullscreen();
        }
      });
    }

    // ----------------------------------------------------
    // 엑셀 파일 로드 및 파싱 기능
    // ----------------------------------------------------
    function handleFileSelect(e) {
      if (e.target.files.length > 0) {
        processExcelFile(e.target.files[0]);
      }
    }

    function processExcelFile(file) {
      if (!file.name.match(/\.(xlsx|xls)$/)) {
        alert('올바른 엑셀 파일(.xlsx, .xls)을 업로드해 주세요.');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          // 가장 오른쪽(마지막) 워크시트 선택
          const sheetNames = workbook.SheetNames;
          if (sheetNames.length === 0) {
            throw new Error('엑셀 파일 내에 워크시트가 존재하지 않습니다.');
          }
          const lastSheetName = sheetNames[sheetNames.length - 1];
          const worksheet = workbook.Sheets[lastSheetName];
          
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          let headerRowIdx = -1;
          let numColIdx = -1;
          let nameColIdx = -1;
          
          for (let r = 0; r < rows.length; r++) {
            const row = rows[r];
            if (!row) continue;
            
            const numIdx = row.findIndex(cell => cell && String(cell).replace(/\s+/g, '').includes('번호'));
            const nameIdx = row.findIndex(cell => cell && String(cell).replace(/\s+/g, '').includes('이름'));
            
            if (numIdx !== -1 && nameIdx !== -1) {
              headerRowIdx = r;
              numColIdx = numIdx;
              nameColIdx = nameIdx;
              break;
            }
          }
          
          if (headerRowIdx === -1) {
            alert("엑셀 시트에서 '번호'와 '이름' 열 헤더를 찾을 수 없습니다. 헤더가 정확히 입력되었는지 확인해 주세요.");
            return;
          }
          
          const parsedStudents = [];
          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row) continue;
            
            const numVal = row[numColIdx];
            const nameVal = row[nameColIdx];
            
            if (numVal !== undefined && numVal !== null && String(numVal).trim() !== '' &&
                nameVal !== undefined && nameVal !== null && String(nameVal).trim() !== '') {
              
              const cleanedNum = String(numVal).trim();
              const cleanedName = String(nameVal).trim();
              
              parsedStudents.push({
                id: `student_${cleanedNum}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                num: cleanedNum,
                name: cleanedName
              });
            }
          }
          
          if (parsedStudents.length === 0) {
            alert("헤더 아래에 있는 학생 목록 데이터를 파싱하지 못했습니다.");
            return;
          }
          
          parsedStudents.sort((a, b) => {
            const numA = parseInt(a.num, 10);
            const numB = parseInt(b.num, 10);
            if (!isNaN(numA) && !isNaN(numB)) {
              return numA - numB;
            }
            return a.num.localeCompare(b.num);
          });
          
          allStudents = parsedStudents;
          seatAssignments = Array(20).fill(null); 
          
          showLoadedFileInfo(file.name);
          updateSeatingUI();
          
          randomShuffleBtn.removeAttribute('disabled');
          clearSeatingBtn.removeAttribute('disabled');
          exportPdfBtn.removeAttribute('disabled');
          
        } catch (err) {
          console.error(err);
          alert('엑셀 파일을 파싱하는 과정에서 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function showLoadedFileInfo(fileName) {
      excelDropzone.style.display = 'none';
      loadedFileName.textContent = fileName;
      fileInfoArea.style.display = 'flex';
    }

    function clearLoadedFile() {
      allStudents = [];
      seatAssignments = Array(20).fill(null);
      excelFileInput.value = '';
      fileInfoArea.style.display = 'none';
      excelDropzone.style.display = 'block';
      
      randomShuffleBtn.setAttribute('disabled', 'true');
      clearSeatingBtn.setAttribute('disabled', 'true');
      exportPdfBtn.setAttribute('disabled', 'true');
      
      updateSeatingUI();
    }

    // ----------------------------------------------------
    // UI 렌더링 로직
    // ----------------------------------------------------
    function renderGrid() {
      seatingGrid.innerHTML = '';
      
      const aisle = document.createElement('div');
      aisle.className = 'seating-aisle';
      const line = document.createElement('div');
      line.className = 'aisle-line';
      aisle.appendChild(line);
      seatingGrid.appendChild(aisle);
      
      for (let i = 0; i < 20; i++) {
        const seatCard = document.createElement('div');
        seatCard.className = 'seat-card';
        seatCard.setAttribute('data-seat-index', i);
        
        const row = Math.floor(i / 4) + 1;
        const colInRow = i % 4; 
        const col = colInRow < 2 ? colInRow + 1 : colInRow + 2; 
        
        seatCard.style.gridRow = row;
        seatCard.style.gridColumn = col;
        
        const emptyInner = document.createElement('div');
        emptyInner.className = 'seat-empty-inner';
        emptyInner.innerHTML = `
          <i data-lucide="plus"></i>
          <span class="seat-empty-text">빈자리</span>
        `;
        seatCard.appendChild(emptyInner);
        
        setupSeatDragAndDrop(seatCard, i);
        seatingGrid.appendChild(seatCard);
      }
      
      initLucide();
    }

    function updateSeatingUI(isAnimate = false) {
      const assignedStudentIds = seatAssignments.filter(s => s !== null).map(s => s.id);
      
      waitingList.innerHTML = '';
      const waitingStudents = allStudents.filter(s => !assignedStudentIds.includes(s.id));
      
      if (waitingStudents.length === 0) {
        if (allStudents.length > 0) {
          waitingList.innerHTML = '<div class="empty-list-msg">모든 학생이 배정되었습니다.</div>';
        } else {
          waitingList.innerHTML = '<div class="empty-list-msg">엑셀 파일을 업로드하면 명단이 표시됩니다.</div>';
        }
        waitingCountBadge.textContent = '0명';
      } else {
        waitingCountBadge.textContent = `${waitingStudents.length}명`;
        waitingStudents.forEach(student => {
          const item = document.createElement('div');
          item.className = 'student-badge-item';
          item.setAttribute('draggable', 'true');
          item.setAttribute('data-student-id', student.id);
          
          item.innerHTML = `
            <span class="num-tag">${student.num}번</span>
            <span class="name-tag">${student.name}</span>
          `;
          
          item.addEventListener('dragstart', (e) => {
            item.classList.add('dragging');
            dragSource = { type: 'waiting', value: student.id };
            e.dataTransfer.setData('text/plain', student.id);
          });
          
          item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            dragSource = null;
          });
          
          waitingList.appendChild(item);
        });
      }
      
      const seatCards = seatingGrid.querySelectorAll('.seat-card');
      let occupiedCount = 0;
      
      seatCards.forEach(card => {
        const idx = parseInt(card.getAttribute('data-seat-index'), 10);
        const student = seatAssignments[idx];
        
        const existingStudentInfo = card.querySelector('.seat-student-info');
        const existingEmptyInner = card.querySelector('.seat-empty-inner');
        if (existingStudentInfo) card.removeChild(existingStudentInfo);
        if (existingEmptyInner) card.removeChild(existingEmptyInner);
        
        card.classList.remove('occupied', 'animate-pop');
        card.removeAttribute('draggable');
        
        if (student) {
          occupiedCount++;
          card.classList.add('occupied');
          card.setAttribute('draggable', 'true');
          
          const studentInfo = document.createElement('div');
          studentInfo.className = 'seat-student-info';
          studentInfo.innerHTML = `
            <span class="seat-student-num">${student.num}번</span>
            <span class="seat-student-name">${student.name}</span>
          `;
          card.appendChild(studentInfo);
          
          if (isAnimate) {
            card.style.animationDelay = `${idx * 40}ms`;
            card.classList.add('animate-pop');
          } else {
            card.style.animationDelay = '0ms';
          }
          
          card.addEventListener('dragstart', (e) => {
            card.classList.add('dragging');
            dragSource = { type: 'seat', value: idx };
            e.dataTransfer.setData('text/plain', student.id);
          });
          
          card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            dragSource = null;
          });
          
        } else {
          const emptyInner = document.createElement('div');
          emptyInner.className = 'seat-empty-inner';
          emptyInner.innerHTML = `
            <i data-lucide="plus"></i>
            <span class="seat-empty-text">빈자리</span>
          `;
          card.appendChild(emptyInner);
        }
      });
      
      occupiedSeatsCount.textContent = occupiedCount;
      emptySeatsCount.textContent = 20 - occupiedCount;
      
      initLucide();
    }

    // ----------------------------------------------------
    // 드래그 앤 드롭 좌석 핸들러
    // ----------------------------------------------------
    function setupSeatDragAndDrop(seatCard, seatIndex) {
      seatCard.addEventListener('dragover', (e) => {
        e.preventDefault(); 
        seatCard.classList.add('dragover');
      });
      
      seatCard.addEventListener('dragleave', () => {
        seatCard.classList.remove('dragover');
      });
      
      seatCard.addEventListener('drop', (e) => {
        e.preventDefault();
        seatCard.classList.remove('dragover');
        
        if (!dragSource) return;
        
        const studentId = e.dataTransfer.getData('text/plain');
        const targetStudent = allStudents.find(s => s.id === studentId);
        
        if (!targetStudent) return;
        
        if (dragSource.type === 'waiting') {
          seatAssignments[seatIndex] = targetStudent;
          updateSeatingUI();
        } 
        else if (dragSource.type === 'seat') {
          const sourceSeatIdx = dragSource.value;
          if (sourceSeatIdx === seatIndex) return; 
          
          const temp = seatAssignments[seatIndex];
          seatAssignments[seatIndex] = seatAssignments[sourceSeatIdx];
          seatAssignments[sourceSeatIdx] = temp;
          
          updateSeatingUI();
        }
      });
    }

    // ----------------------------------------------------
    // 자리 배정 및 제어 로직
    // ----------------------------------------------------
    function assignSeatsRandomly() {
      if (allStudents.length === 0) return;
      
      const shuffled = [...allStudents];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; 
      }
      
      seatAssignments = Array(20).fill(null);
      const assignLimit = Math.min(shuffled.length, 20);
      
      for (let i = 0; i < assignLimit; i++) {
        seatAssignments[i] = shuffled[i];
      }
      
      updateSeatingUI(true);
    }

    function resetSeating() {
      if (allStudents.length === 0) return;
      seatAssignments = Array(20).fill(null);
      updateSeatingUI();
    }

    function exportToPdf() {
      window.print();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        appContainer.requestFullscreen()
          .then(() => {
            appContainer.classList.add('fullscreen-mode');
          })
          .catch(err => {
            alert(`전체화면 모드 진입 오류: ${err.message}`);
          });
      } else {
        exitFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen()
          .then(() => {
            appContainer.classList.remove('fullscreen-mode');
          });
      }
    }

    // 앱 기동 시 디렉토리 내의 '공동실습소 출석부.xlsx' 자동 로드 시도
    function loadDefaultExcelFile() {
      const defaultFileName = '공동실습소 출석부.xlsx';
      fetch(`./${defaultFileName}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('디폴트 파일을 찾을 수 없거나 서버 연결이 필요합니다.');
          }
          return response.arrayBuffer();
        })
        .then(arrayBuffer => {
          const data = new Uint8Array(arrayBuffer);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const sheetNames = workbook.SheetNames;
          if (sheetNames.length === 0) return;
          const lastSheetName = sheetNames[sheetNames.length - 1];
          const worksheet = workbook.Sheets[lastSheetName];
          
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          let headerRowIdx = -1;
          let numColIdx = -1;
          let nameColIdx = -1;
          
          for (let r = 0; r < rows.length; r++) {
            const row = rows[r];
            if (!row) continue;
            const numIdx = row.findIndex(cell => cell && String(cell).replace(/\s+/g, '').includes('번호'));
            const nameIdx = row.findIndex(cell => cell && String(cell).replace(/\s+/g, '').includes('이름'));
            if (numIdx !== -1 && nameIdx !== -1) {
              headerRowIdx = r;
              numColIdx = numIdx;
              nameColIdx = nameIdx;
              break;
            }
          }
          
          if (headerRowIdx === -1) return;
          
          const parsedStudents = [];
          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row) continue;
            const numVal = row[numColIdx];
            const nameVal = row[nameColIdx];
            if (numVal !== undefined && numVal !== null && String(numVal).trim() !== '' &&
                nameVal !== undefined && nameVal !== null && String(nameVal).trim() !== '') {
              const cleanedNum = String(numVal).trim();
              const cleanedName = String(nameVal).trim();
              parsedStudents.push({
                id: `student_${cleanedNum}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                num: cleanedNum,
                name: cleanedName
              });
            }
          }
          
          if (parsedStudents.length === 0) return;
          
          parsedStudents.sort((a, b) => {
            const numA = parseInt(a.num, 10);
            const numB = parseInt(b.num, 10);
            if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
            return a.num.localeCompare(b.num);
          });
          
          allStudents = parsedStudents;
          seatAssignments = Array(20).fill(null);
          
          showLoadedFileInfo(defaultFileName);
          updateSeatingUI();
          
          randomShuffleBtn.removeAttribute('disabled');
          clearSeatingBtn.removeAttribute('disabled');
          exportPdfBtn.removeAttribute('disabled');
          console.log('디폴트 출석부 자동 로드 성공:', allStudents.length, '명');
        })
        .catch(err => {
          console.log('자동 로드 스킵 (수동 업로드 가능):', err.message);
        });
    }
  </script>
</body>
</html>
